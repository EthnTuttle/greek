[package]
name = "uniffi-bindings"
version = "0.1.0"
edition = "2021"

[lib]
# "rlib" lets host-side integration tests (tests/) link the crate; the
# Android build consumes only the cdylib .so as before.
crate-type = ["cdylib", "staticlib", "rlib"]
name = "uniffi_bindings"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
greek-core = { path = "../core" }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
