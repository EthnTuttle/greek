[package]
name = "uniffi-bindings"
version = "0.1.0"
edition = "2021"

[lib]
# "rlib" lets host-side integration tests (tests/) link the crate; the
# Android build consumes only the cdylib .so as before.
crate-type = ["cdylib", "staticlib", "rlib"]
name = "uniffi_bindings"

[dependencies]
uniffi = { version = "0.28", features = ["cli", "tokio"] }
greek-core = { path = "../core" }
sync-nostr = { path = "../sync-nostr" }
# Progress sharing (DESIGN-progress-sharing.md). W9-C consumes the frozen
# W9-B engine surface; crate lands as crates/share-nostr at merge time.
# INTEGRATION-STEP: root workspace `members` must also gain "crates/share-nostr"
# (root Cargo.toml is owned outside this wave's file set).
share-nostr = { path = "../share-nostr" }
sync-iroh = { path = "../sync-iroh" }
nostr-sdk = { version = "0.43", default-features = false, features = ["nip44"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
uuid = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
