[package]
name = "uniffi-bindings"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "uniffi_bindings"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
greek-core = { path = "../core" }
serde_json = { workspace = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
