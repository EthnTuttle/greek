# CI — audit item R4 (production-readiness-2026-10-20.md: "no checked-in CI
# workflow for release validation"). Independent gates; no job blocks another.
# Job → audit-gate mapping lives in scripts/ci/README.md.
name: CI

on:
  push:
    branches: [main]
    # Docs-only edits don't need the full matrix. Paths are repo-root relative.
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Rust core
  # Mobile/CLI workspace (desktop/ is a separate workspace + lockfile; it gets
  # its own job below). The 4 live-network probes in crates/sync-nostr are
  # #[ignore]'d, so the default `cargo test` already excludes them.
  rust-test:
    runs-on: ubuntu-latest
    steps:
      # checkout v5 — pin major tag, not sha (see repo convention note below)
      - uses: actions/checkout@v5

      # dtolnay/rust-toolchain @stable: rustup-provided stable channel
      - uses: dtolnay/rust-toolchain@stable

      # Swatinem/rust-cache v2: cargo registry + target/ cache keyed on lockfile
      - uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace)
        run: cargo test --workspace --locked

  # ---------------------------------------------------- Desktop (Tauri shell)
  # Separate workspace/lockfile (root Cargo.toml has exclude = ["desktop"]).
  # The contract test target compiles the src-tauri LIB + its build.rs
  # (tauri-build codegen over desktop/src-ui), which links the wry/gtk/webkit
  # stack, so the webkit2gtk dev packages are required even though no window
  # is opened. Minimal set; libwebkit2gtk-4.1-dev pulls libsoup-3.0/jsc.
  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev
        # ^ libayatana-appindicator3-dev: tauri default features include
        # tray-icon → muda → libappindicator-sys links against it.

      - uses: dtolnay/rust-toolchain@stable

      # Separate cache key: this job uses desktop/src-tauri/Cargo.lock, not the
      # root lockfile, so target-dir contents don't overlap with rust-test.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: desktop

      - name: contract tests (serial — tests share no state but keep a deterministic log order)
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            --test contract -- --test-threads=1

  # ------------------------------------------------------------------- Android
  # JDK 17 (compileOptions/kotlinOptions pin 17; AGP 8.7.3 requires it;
  # Gradle 8.14.3 wrapper runs fine on 17). ubuntu-latest images ship the
  # Android SDK with licenses pre-accepted — no setup-android step needed.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-java v4 — temurin 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle/actions/setup-gradle v4: wrapper validation + build-cache/home cache
      - uses: gradle/actions/setup-gradle@v4

      # Hard gates: unit tests + polytonic keyboard coverage audit.
      # (polytonicAudit tolerates the gitignored data/morphology.sqlite being
      # absent — morphology half skips with a warning; decks still audited.)
      - name: Unit tests + polytonic audit
        run: ./gradlew :app:testDebugUnitTest :app:polytonicAudit
        working-directory: android

      # Lint is SEPARATE on purpose: the audit (2026-10-20) records 4 known
      # lint ERRORS that are triaged, not fixed — 3 NewApi "Cleaner" findings
      # in GENERATED code (android/app/src/main/java/uniffi/uniffi_bindings/
      # uniffi_bindings.kt, regenerated by uniffi-bindgen — reflecting over
      # Cleaner by design) and 1 produceState finding in SyncScreen.kt.
      # scripts/ci/lint-triage.sh fails the job iff any error OTHER than
      # those known signatures appears, so lint stays a gate instead of going
      # red forever or being silenced entirely (no baseline file exists; a
      # baseline would also freeze the 57 warnings, hiding regressions there).
      - name: Lint with known-findings triage
        run: bash ../scripts/ci/lint-triage.sh
        working-directory: android

  # ----------------------------------------------------------- Pinned artifacts
  # data/morphology.sqlite is git-ignored by design (113MB; distributed via
  # GitHub Releases / manual channel, pinned by SHA-256 in data/MANIFEST).
  # A plain CI checkout therefore CANNOT do `sha256sum -c data/MANIFEST`.
  # Honest gate here: MANIFEST must be well-formed and any artifact that DOES
  # exist in the tree must match its pin. Mismatch → fail; absent → notice.
  # Actual hash enforcement on download happens in the release/build path
  # (scripts/desktop-stage-morphology.sh verifies before staging for Tauri).
  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate MANIFEST format + pin consistency
        run: |
          set -euo pipefail

          echo "== MANIFEST format check =="
          # Every non-comment line must be: <64-hex sha256>  <path>
          bad=$(grep -vE '^\s*($|#)' data/MANIFEST \
              | grep -cvE '^[0-9a-f]{64}  [^ ]+\s*(#.*)?$' || true)
          if [ "$bad" != "0" ]; then
            echo "::error::data/MANIFEST has $bad malformed pin line(s) (want '<sha256>  <path>')"
            grep -vE '^\s*($|#)' data/MANIFEST | grep -vE '^[0-9a-f]{64}  [^ ]+\s*(#.*)?$'
            exit 1
          fi
          echo "MANIFEST format OK"

          echo "== Pin verification =="
          # --ignore-missing: artifacts absent from the checkout are skipped.
          # Anything present that does NOT match its pin fails the job.
          if ! sha256sum -c data/MANIFEST --ignore-missing; then
            echo "::error::A pinned artifact present in the checkout does not match its SHA-256 pin."
            exit 1
          fi

          if [ ! -f data/morphology.sqlite ]; then
            echo "::notice::data/morphology.sqlite is git-ignored and absent from this checkout —" \
                 "SHA-256 verification is expected to happen at release-artifact fetch time" \
                 "(GitHub Release asset, pinned by data/MANIFEST; see scripts/desktop-stage-morphology.sh)."
          fi
