# Release checks — deliberately NOT per-push (audit gate A5 needs a fully built
# APK, which is too heavy for every commit). Trigger by hand before attaching
# an APK to a GitHub Release.
name: release-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Audit item A5: `lib/` in the shipped APK must contain ONLY arm64-v8a and
  # x86_64 — the abiFilters block in android/app/build.gradle.kts exists
  # because the app's Rust library is built for exactly those two ABIs, and
  # pre-filter APKs let 32-bit devices install and then crash in
  # System.loadLibrary (GreekApplication.kt).
  abi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        working-directory: android
        # NOTE on signing: android/keystore.properties is git-ignored, so in CI
        # this yields app-release-unsigned.apk. That is the intended behavior
        # (android/app/build.gradle.kts: "produces an unsigned APK otherwise")
        # — the abiFilters gate we verify applies to the ZIP regardless of who
        # signs it later.
        #
        # NOTE on native libs: android/app/src/main/jniLibs/**.so is git-ignored
        # too (built out-of-band with cargo-ndk), so this APK contains only
        # dependency .so files (e.g. JNA — which ships armeabi-v7a/x86 and is
        # exactly what the abiFilters must strip). The app's own .so is absent
        # here; this gate verifies the FILTER, not the Rust toolchain output.

      - name: Assert APK lib/ contains only arm64-v8a + x86_64
        run: |
          set -euo pipefail
          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          echo "inspecting: $apk"

          # lib/<abi>/<file>.so entries → unique sorted ABI list
          abis="$(unzip -l "$apk" | awk '/ lib\/[^/]+\// {print $4}' \
                    | cut -d/ -f2 | sort -u)"
          echo "ABIs in APK:"; printf '%s\n' "$abis"

          # Every ABI must be in the allowed set (abiFilters contract).
          bad="$(printf '%s\n' "$abis" | grep -vE '^(arm64-v8a|x86_64)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::APK contains disallowed ABI(s): $bad — abiFilters regression (audit A5)"
            exit 1
          fi

          # Both supported ABIs must actually be present (dependency JNI libs
          # like JNA's jnidispatch provide them even in this CI build).
          for want in arm64-v8a x86_64; do
            if ! printf '%s\n' "$abis" | grep -qx "$want"; then
              echo "::error::expected ABI $want missing from APK lib/"
              exit 1
            fi
          done
          echo "abi-check: PASS (lib/ restricted to arm64-v8a + x86_64)"
