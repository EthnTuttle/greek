[package]
name = "spike-iroh"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
iroh = "1"
iroh-docs = "0.101"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
n0-future = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[workspace]
